<form method="post" action="/items/review">

    <input
        type="hidden"
        name="item_id"
        value="{{ extraction.item_id }}"
    >

    <label for="brand">Brand:</label>
    <input
        id="brand"
        name="brand"
        value="{{ extraction.brand }}"
    >

    <p>
        Extracted signature:
        <strong>{{ extraction.signature }}</strong>
    </p>

    <button type="submit">Confirm Review</button>

</form>
